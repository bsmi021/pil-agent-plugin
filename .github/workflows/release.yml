name: Release

# Fires after a merge into main. The marketplace lists more than one plugin
# and each is released on its own tag, so this tags and releases every listed
# plugin whose current version has no GitHub Release yet; when all are
# released it is a no-op. A tag left without a release by a failed run is
# reused, and the next run creates the missing release on it. Each release's
# notes and title are the matching Status entry from that plugin's own
# README.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tags in this repository are named "<plugin name>--v<version>"
      # (pil-agent-plugin--v0.6.0 and back through v0.2.0; blender-inspect--v0.1.0
      # onwards), so the generated tags have to match or releases stop sorting
      # together. release_plan.py prints one tab-separated line per plugin whose
      # GitHub Release is missing (it reads them with gh, hence GH_TOKEN): name,
      # version, tag, README path.
      - name: Plan the releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/release_plan.py > RELEASE_PLAN.tsv
          cat RELEASE_PLAN.tsv
          if [ -s RELEASE_PLAN.tsv ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Every marketplace plugin's version is already released; nothing to release."
          fi

      # Never tag a version the repo does not agree on: the conformance suite
      # checks every plugin's four manifests, its marketplace listing and each
      # shipped tool's TOOL_VERSION against each other.
      - name: Install uv
        if: steps.plan.outputs.pending == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify packaging conformance before tagging
        if: steps.plan.outputs.pending == 'true'
        run: |
          uv sync --locked
          uv run pytest -q tests/test_packaging_conformance.py

      # Both the notes and the title come from the one Status entry in that
      # plugin's README, so a generated release reads like the hand-written
      # ones before it ("0.5.0 — Phase 3 complete"), not like a bare tag name.
      # Every plugin's notes are extracted before any tag is pushed, so a
      # missing Status entry stops the run with nothing half-released.
      - name: Extract release notes and titles from each README Status
        if: steps.plan.outputs.pending == 'true'
        run: |
          while IFS=$'\t' read -r NAME VERSION TAG README; do
            python .github/scripts/release_notes.py --readme "$README" "$VERSION" > "RELEASE_NOTES-$TAG.md"
            python .github/scripts/release_notes.py --title --readme "$README" "$VERSION" > "RELEASE_TITLE-$TAG.txt"
            echo "$TAG: $(cat "RELEASE_TITLE-$TAG.txt")"
            cat "RELEASE_NOTES-$TAG.md"
          done < RELEASE_PLAN.tsv

      - name: Create the tags and the releases
        if: steps.plan.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS=$'\t' read -r NAME VERSION TAG README; do
            # A tag without a release is what a failed run leaves behind:
            # keep the tag and only create the release.
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "$TAG already tagged; creating its missing release."
            else
              git tag -a "$TAG" -m "Release $TAG"
              git push origin "$TAG"
            fi
            # Left to itself, GitHub picks the repo's Latest by date and version,
            # so blender-inspect--v0.1.0 (created second) took it from
            # pil-agent-plugin. /releases/latest has always meant
            # pil-agent-plugin, so every other plugin's release is created with
            # --latest=false.
            if [ "$NAME" = "pil-agent-plugin" ]; then LATEST=true; else LATEST=false; fi
            gh release create "$TAG" \
              --title "$(cat "RELEASE_TITLE-$TAG.txt")" \
              --notes-file "RELEASE_NOTES-$TAG.md" \
              --latest="$LATEST" \
              --verify-tag
          done < RELEASE_PLAN.tsv
