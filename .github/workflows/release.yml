name: Release

# Fires after a merge into main. If the version in the plugin manifest has a
# tag already, this is a no-op; otherwise it tags the merge commit and cuts a
# GitHub Release whose notes are the matching Status entry from README.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the manifest version
        id: version
        run: |
          VERSION="$(python -c 'import json;print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $VERSION"

      - name: Skip if this version is already released
        id: check
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.version.outputs.tag }} already exists; nothing to release."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # Never tag a version the repo does not agree on: the conformance suite
      # checks the four manifests, the marketplace listing and every shipped
      # tool's TOOL_VERSION against each other.
      - name: Install uv
        if: steps.check.outputs.already == 'false'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify packaging conformance before tagging
        if: steps.check.outputs.already == 'false'
        run: |
          uv sync --locked
          uv run pytest -q tests/test_packaging_conformance.py

      - name: Extract release notes from README Status
        if: steps.check.outputs.already == 'false'
        run: |
          python .github/scripts/release_notes.py \
            "${{ steps.version.outputs.version }}" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create the tag and the release
        if: steps.check.outputs.already == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
