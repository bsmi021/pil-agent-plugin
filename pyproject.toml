[project]
name = "pil-agent-plugin"
version = "0.6.0"
description = "Quantitative image measurement and diffing tools for coding agents, complementing native multimodal vision"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
reconstruction = [
    "opencv-python-headless>=4.10,<5",
    "scipy>=1.14,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import fixtures from conftest by module name.
pythonpath = ["tests", "scripts"]
